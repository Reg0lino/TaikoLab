name: "mathcore"
description: "Mathcore & Metallic Hardcore (Tight kick + guitar chug fusion, odd-meter friendly)"

normal_follow_mode: "hybrid"
hard_follow_mode: "drums"
oni_follow_mode: "hybrid"

fold_blasts_to_rolls: true
enable_big_notes: true
big_note_threshold: 0.72

hihat_min_velocity: 0.70
vocal_min_strength: 0.42
guitar_min_strength: 0.48

drum_mapping:
  kick: "don"
  tom: "don"
  snare: "kat"
  crash: "kat"
  ride: "kat"
  hihat: "ignore"
  unknown: "don"