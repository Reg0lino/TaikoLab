name: "alt_rock"
description: "Alternative rock (drum-led charts with restrained cymbal accents)"

normal_follow_mode: "drums"
hard_follow_mode: "drums"
oni_follow_mode: "hybrid"

fold_blasts_to_rolls: true
enable_big_notes: true
big_note_threshold: 0.88

hihat_min_velocity: 0.90
vocal_min_strength: 0.36
guitar_min_strength: 0.58

drum_mapping:
  kick: "don"
  tom: "don"
  snare: "kat"
  crash: "kat"
  ride: "kat"
  hihat: "ignore"
  unknown: "don"
